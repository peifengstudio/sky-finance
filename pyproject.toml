[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sky-finance"
version = "0.1.0"
description = "Local-first financial intelligence platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Data ingestion
    "yfinance>=0.2",
    "feedparser>=6.0",
    "httpx>=0.27",

    # Data pipeline
    "pandas>=2.2",
    "numpy>=2.0",

    # Database + vector store
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",    # connection pool — prevents per-task open/close overhead
    "pgvector>=0.3",

    # LLM / embeddings
    "openai>=1.30",
    "anthropic>=0.40",
    "ollama>=0.3",

    # Web dashboard
    "streamlit>=1.35",

    # Notifications
    "slack-sdk>=3.27",

    # Task queue
    "celery[redis]>=5.4",

    # Web dashboard
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # form / query parsing for FastAPI

    # Config
    "tomli>=2.0 ; python_version < '3.11'",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Migrations
    "alembic>=1.13",
    "sqlalchemy>=2.0",   # required by alembic; app code still uses raw psycopg3
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "flower>=2.0",   # Celery monitoring UI
    "honcho>=1.1",           # Procfile-based process manager for local dev
    "respx>=0.21",           # httpx request mocking for news_fetcher tests
    "jupyterlab>=4.0",       # notebook environment
    "matplotlib>=3.8",       # plots in exploration notebooks
    "ipython",
    "pandas-stubs>=2.2",     # type stubs for pandas
    "types-requests>=2.31",  # type stubs for requests (used by ingestion/tasks.py)
]

[project.scripts]
sky-finance        = "sky_finance.cli:main"
sky-eval           = "sky_finance.evaluation.cli:main"
sky-validate-stocks = "sky_finance.config_validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_finance"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "feedparser", "feedparser.*", "pgvector", "pgvector.*", "celery", "celery.*", "redis", "redis.*", "ollama", "ollama.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    # Infrastructure that requires live services (DB, Redis, Celery, Slack)
    "*/dashboard/*",
    "*/scheduler/*",
    "*/notifications/tasks.py",
    "*/evaluation/runner.py",
    "*/evaluation/cli.py",
    "*/storage/db.py",
    "*/storage/repository.py",
    "*/storage/tasks.py",
    "*/strategies/repository.py",
    "*/strategies/tasks.py",
    "*/ingestion/tasks.py",
    "*/pipeline/tasks.py",
    "*/logging_config.py",
    "*/settings.py",
    "*/config.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sky_finance --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=70"

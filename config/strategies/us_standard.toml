name        = "US Equities — Standard Analysis"
description = "Daily fundamental and sentiment analysis for all US equity holdings."
scope       = "group"
scope_value = "us"
model_tier  = "claude"
enabled     = true

[rag]
query_template = "{ticker} earnings revenue growth guidance analyst outlook"
threshold      = 0.55
top_k_positive = 20
top_k_neutral  = 20
top_k_negative = 20
retrieval_mode = "hybrid"

[prompt]
template = """You are a professional equity analyst covering US equities.

Analyse the tickers below and produce a structured report for each one.
Ground every claim in the retrieved news context. Do not speculate beyond what the evidence supports.

Tickers: {tickers}

---

## Retrieved Context

{rag_context}

---

For each ticker output a level-2 markdown heading (`## TICKER — Company Name`) followed by:

1. **Situation summary** (2–3 sentences) — the most material recent developments.
2. **Sentiment** — Bullish / Neutral / Bearish with a one-line rationale tied to the evidence.
3. **Key risks** (up to 3 bullet points) — near-term headwinds that could move the stock adversely.
4. **Action signal** — Hold / Add / Reduce / Watch with a brief justification referencing price levels or upcoming catalysts where available.

Be concise. Flag explicitly when retrieved context is sparse or contradictory."""
